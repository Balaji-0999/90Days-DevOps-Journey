<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 31 | Docker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #172554, #0c4a6e);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 45px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .docker-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            margin-bottom: 20px;
            border: 1px solid #38bdf8;
            border-radius: 50px;
            color: #7dd3fc;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(32px, 7vw, 52px);
            line-height: 1.1;
            margin-bottom: 18px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .day {
            font-size: 20px;
            font-weight: bold;
            color: #7dd3fc;
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .topic {
            padding: 9px 14px;
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 12px;
            color: #e0f2fe;
            font-size: 14px;
            transition: 0.3s;
        }

        .topic:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #94a3b8;
        }

        @media (max-width: 500px) {
            .container {
                padding: 35px 20px;
            }

            .docker-icon {
                font-size: 52px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="docker-icon">🐳</div>

        <div class="badge">90 DAYS OF DEVOPS</div>

        <h1>
            Hello from my <span>Docker</span> image!
        </h1>

        <p>
            Day <span class="day">31</span> of my
            <strong>90DaysOfDevOps</strong> journey.
        </p>

        <div class="topics">
            <div class="topic">🐳 Dockerfile</div>
            <div class="topic">📦 Docker Images</div>
            <div class="topic">⚡ Build Cache</div>
            <div class="topic">🚀 Containers</div>
        </div>

        <div class="footer">
            Learning • Building • Automating • Growing 🚀
        </div>

    </div>

</body>
</html>
